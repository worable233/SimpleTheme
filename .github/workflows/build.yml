# 自动构建打包：
# - push 到 main / PR：类型检查 + 构建 + 打主题 ZIP，作为 artifact 供下载
# - push v* 标签：额外创建 GitHub Release 并附上 ZIP
name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 满足 engines: ^20.19.0 || >=22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # prepackage 会自动执行 build-only（vite build + prism/emoji 处理），
      # 再由 bin/package-theme.mjs 产出 Simple-Theme-v<版本>.zip
      - name: Build & package theme
        run: npm run package

      - name: Upload theme zip
        uses: actions/upload-artifact@v4
        with:
          name: theme-zip
          path: Simple-Theme-v*.zip
          if-no-files-found: error

      # 打 v* 标签时发布 Release（版本号以 style.css 的 Version 为准）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Simple-Theme-v*.zip
          generate_release_notes: true
